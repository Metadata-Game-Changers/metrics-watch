# Scheduled metadata scoring: runs the MGC use-case scorer against the repositories
# in config.json, commits the reports and the regenerated trend page back to the repo.
# Fork this repository, edit config.json, enable Actions on your fork — that's the setup.
name: Score metadata

on:
  schedule:
    - cron: '0 6 * * *'   # daily 06:00 UTC — each set's own "schedule" in config.json
                          # decides what actually runs (daily / weekly / monthly)
  workflow_dispatch:       # the "Run workflow" button always scores every set

permissions:
  contents: write          # the job commits reports back to this repository

jobs:
  score:
    runs-on: ubuntu-latest  # jq is preinstalled on GitHub's ubuntu runners
    steps:
      - uses: actions/checkout@v4

      - name: Score repositories
        # scheduled runs score only the sets due today; the manual button runs everything
        run: python3 scoreRepository.py --config config.json ${{ github.event_name == 'schedule' && '--due' || '' }}

      - name: Rebuild trend page
        run: python3 makeTrendPage.py

      - name: Commit reports
        run: |
          git config user.name "metrics-watch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Metrics run $(date -u +%Y-%m-%dT%H)"
            git push
          fi
